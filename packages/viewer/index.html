<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPR</title>
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // The theme before the first paint (V29b): what Settings' Appearance kept, else dark.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('cpr.viewer.theme');
        } catch (e) {}
        document.documentElement.dataset.theme =
          theme === 'light' || theme === 'system' ? theme : 'dark';
        // In CPR's window (N1c), its title bar is the page's: marked before the first paint. On
        // Linux its frame is too (N1d): rounded corners, square while the window fills the screen.
        var app = window.cprApp;
        if (app) document.documentElement.dataset.app = app.platform;
        if (app && app.frame === 'own') {
          document.documentElement.dataset.frame = 'own';
          document.documentElement.dataset.window = app.maximized ? 'maximized' : 'normal';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
