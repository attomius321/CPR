<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPR</title>
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // The theme before the first paint (V29b): what Settings' Appearance kept, else dark.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('cpr.viewer.theme');
        } catch (e) {}
        document.documentElement.dataset.theme =
          theme === 'light' || theme === 'system' ? theme : 'dark';
        // In CPR's window (N1c), its title bar is the page's: marked before the first paint.
        if (window.cprApp) document.documentElement.dataset.app = window.cprApp.platform;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
