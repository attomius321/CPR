<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'"
    />
    <title>Symbiote</title>
    <link rel="stylesheet" href="start.css" />
    <script src="frame.js"></script>
    <script src="start.js" defer></script>
  </head>
  <body>
    <div id="root">
      <!-- Symbiote's window has no system title bar (N1c): this strip moves it, under its buttons; on
         Linux the buttons are the page's own (N1d). -->
      <div class="start-bar">
        <div id="window-buttons" class="window-buttons" hidden>
          <button id="window-minimize" type="button" aria-label="Minimize" title="Minimize">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" /></svg>
          </button>
          <button id="window-maximize" type="button" aria-label="Maximize" title="Maximize">
            <svg class="maximize" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="4" y="4" width="8" height="8" rx="1.5" />
            </svg>
            <svg class="restore" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="3.5" y="5.5" width="7" height="7" rx="1.5" />
              <path
                d="M6 5.5V5A1.5 1.5 0 0 1 7.5 3.5H11A1.5 1.5 0 0 1 12.5 5v3.5A1.5 1.5 0 0 1 11 10h-.5"
              />
            </svg>
          </button>
          <button id="window-close" class="close" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
          </button>
        </div>
      </div>
      <main class="start">
        <img class="mark" src="mark.png" alt="" width="40" height="40" draggable="false" />
        <h1>Symbiote</h1>
        <p class="lede">Review changes as a graph of symbols, with your agents' workspaces.</p>
        <p id="status" class="status" role="status" hidden></p>
        <button id="open" type="button" class="primary">
          Open a repository… <kbd id="open-key">Ctrl+O</kbd>
        </button>
        <section class="recent" aria-labelledby="recent-heading">
          <h2 id="recent-heading">Recent</h2>
          <ul id="recent"></ul>
          <p id="no-recent" class="muted" hidden>The repositories you open show here.</p>
        </section>
      </main>
    </div>
  </body>
</html>
