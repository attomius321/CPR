# Symbiote's log viewer (LG1, decision 357): another app, so the logs are there when Symbiote has
# crashed. Alloy follows the folder Symbiote writes, Loki keeps its own copy, Grafana shows it.
# Start it with `pnpm logs:up`, which makes the folder first: one Docker made would be root's,
# and Symbiote could not write in it.
name: symbiote-logs

services:
  loki:
    image: grafana/loki:3.7.9
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    ports:
      - 127.0.0.1:${SYMBIOTE_LOKI_PORT-3100}:3100
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.2
    command: run --storage.path=/var/lib/alloy/data --disable-reporting /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ${SYMBIOTE_LOG_DIR:?the folder Symbiote writes; pnpm logs:up sets it}:/symbiote-logs:ro
      - alloy:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # Read without signing in, as a viewer (Grafana 13's only role for it): Explore, Logs
      # Drilldown and the dashboard. It listens on this machine only. Sign in as admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/symbiote.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - 127.0.0.1:${SYMBIOTE_GRAFANA_PORT-3300}:3000
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki:
  alloy:
  grafana:
