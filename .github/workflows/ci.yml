name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
        with:
          # One parent commit, so Symbiote can review the change it is being tested on.
          fetch-depth: 2
      # Installs pnpm (from packageManager), Node, and runs a frozen `pnpm install`.
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - run: pnpm run format:check
      # Typed ESLint over every package peaks at ~3.2 GB of heap (2.4 GB live, fix-ci-green); a
      # macOS runner's default limit is ~2 GB, Ubuntu's ~4 GB.
      - run: pnpm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm run typecheck
      # Not on macOS (the person's call, fix-ci-green): 6 unit tests fail only there, hidden behind
      # lint's crash since 2026-10-13 (the plan's results list them). Lint, types and the build
      # still run on it.
      - run: pnpm run test
        if: runner.os != 'macOS'
      - run: pnpm run build
      - name: CLI smoke test
        run: node packages/cli/dist/bin.js --version
      - name: Dogfood (symbiote reviews this commit)
        run: node packages/cli/dist/bin.js diff HEAD~1 --out symbiote-graph.json
      - name: Viewer end-to-end tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          pnpm exec playwright install --with-deps chromium
          # The desktop app's specs (N1): Electron's binary, and Chromium's sandbox, which
          # Ubuntu 24.04's AppArmor refuses to an Electron outside a package. They start their
          # own Xvfb (installed with Chromium's dependencies).
          pnpm run app:setup
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          pnpm run test:e2e
