name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
        with:
          # One parent commit, so CPR can review the change it is being tested on.
          fetch-depth: 2
      # Installs pnpm (from packageManager), Node, and runs a frozen `pnpm install`.
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: CLI smoke test
        run: node packages/cli/dist/bin.js --version
      - name: Dogfood (cpr reviews this commit)
        run: node packages/cli/dist/bin.js diff HEAD~1 --out cpr-graph.json
      - name: Viewer end-to-end tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
