# Symbiote for GitLab merge requests. Add to your .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/attomius321/Symbiote/main/ci/gitlab/symbiote.yml
#
# The `symbiote` job runs on merge request pipelines. With no token, its findings show in the merge
# request's Code Quality widget. With a GITLAB_TOKEN CI/CD variable (a project or personal
# access token with api scope, masked), they are also posted as comments on their lines; the
# job token cannot comment. Override the variables below in your own `symbiote:` job.

.symbiote:
  image: node:22
  variables:
    GIT_DEPTH: '0' # the merge-base needs history
    SYMBIOTE_VERSION: main # branch or tag of Symbiote
    SYMBIOTE_POST_FINDINGS: warning # needs GITLAB_TOKEN; empty: don't post
    SYMBIOTE_FAIL_ON: error # empty: never fail the job
    SYMBIOTE_PLUGINS: '' # e.g. angular; comma-separated, besides those in symbiote/config.json
    SYMBIOTE_OUT: $CI_PROJECT_DIR/.symbiote
  script:
    - git clone --quiet --depth 1 --branch "$SYMBIOTE_VERSION" https://github.com/attomius321/Symbiote.git /tmp/symbiote
    - (cd /tmp/symbiote && bash action/install.sh)
    - |
      if [ -z "${GITLAB_TOKEN:-}" ] && [ -n "$SYMBIOTE_POST_FINDINGS" ]; then
        echo "No GITLAB_TOKEN: findings go to the Code Quality widget, not comments."
        SYMBIOTE_POST_FINDINGS=""
      fi
      export SYMBIOTE_POST_FINDINGS
      SYMBIOTE_CLI="node /tmp/symbiote/packages/cli/dist/bin.js" \
      SYMBIOTE_CODEQUALITY="$SYMBIOTE_OUT/gl-code-quality-report.json" \
        bash /tmp/symbiote/action/run.sh
  artifacts:
    when: always
    paths:
      - .symbiote/
    reports:
      codequality: .symbiote/gl-code-quality-report.json

symbiote:
  extends: .symbiote
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
